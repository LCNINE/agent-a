name: Release (Linux)

on:
  push:
    tags:
      - 'v*'
  # 이미 나간 릴리스에 리눅스 산출물만 뒤늦게 붙일 때 수동 실행.
  # package.json 의 version 과 같은 태그의 릴리스에 업로드된다.
  workflow_dispatch:

permissions:
  contents: write

# release.yml 과 같은 그룹 — 두 워크플로가 동시에 릴리스를 만들려다 충돌하지 않게 직렬화
concurrency:
  group: release-${{ github.ref }}

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # AppImage 만: snap 은 snapcraft 가, deb 는 maintainer 이메일이 필요하다
      - name: Build Linux artifacts
        run: npx electron-builder --linux AppImage -p never

      # electron-builder 의 publisher 대신 gh 로 올린다.
      # publisher 는 draft 릴리스에만 올리려 해서 이미 게시된 릴리스에 붙일 수 없다.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          files=(dist/*.AppImage)
          # 자동 업데이트 메타파일은 생성될 때만 첨부
          [ -f dist/latest-linux.yml ] && files+=(dist/latest-linux.yml) || true
          gh release upload "$tag" "${files[@]}" --clobber
